repos:
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: '3.2.0'
    hooks:
      - id: editorconfig-checker
        alias: ec
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
